name: PR checks

on:
  pull_request:
    types: [opened, synchronize, edited, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | npx commitlint --extends @commitlint/config-conventional

      - name: Comment on invalid title
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const rule = '`type(scope): subject`\n\n支持的类型: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `标题不符合 Conventional Commits 规范，请按以下格式修改:\n\n${rule}`
            });

  content-checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Auto label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              ...context.repo,
              pull_number: context.payload.pull_request.number
            });

            const labels = [];
            const paths = files.map(f => f.filename);

            if (paths.some(p => p.startsWith('skills/'))) labels.push('area/skills');
            if (paths.some(p => p.startsWith('openspec/'))) labels.push('area/openspec');
            if (paths.some(p => p.startsWith('src/'))) labels.push('area/cli');
            if (paths.some(p => p.startsWith('scripts/'))) labels.push('area/scripts');
            if (paths.some(p => /^(package|package-lock)\.json$/.test(p))) labels.push('dependencies');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                labels
              });
            }
