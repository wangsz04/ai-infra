name: Scheduled maintenance

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: npm audit
        id: audit
        run: |
          npm audit --json > audit.json 2>&1 || true
          {
            echo "report<<EOF"
            cat audit.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue on vulnerabilities
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT || '';
            if (!report) return;
            try {
              const data = JSON.parse(report);
              const vulns = Object.keys(data.vulnerabilities || {}).length;
              if (vulns > 0) {
                await github.rest.issues.create({
                  ...context.repo,
                  title: `[安全] 发现 ${vulns} 个依赖漏洞`,
                  body: `## npm audit 报告\n\n\`\`\`json\n${report}\n\`\`\``,
                  labels: ['security']
                });
              }
            } catch(e) {}
        env:
          REPORT: ${{ steps.audit.outputs.report }}

  outdated-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Check outdated deps
        id: outdated
        run: |
          npm outdated --json > outdated.json 2>&1 || true
          {
            echo "report<<EOF"
            cat outdated.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue for outdated deps
        uses: actions/github-script@v7
        with:
          script: |
            const raw = process.env.REPORT || '{}';
            try {
              const deps = JSON.parse(raw);
              const names = Object.keys(deps);
              if (names.length > 0) {
                const list = names.map(n => `- \`${n}\`: ${deps[n].current} → ${deps[n].latest}`).join('\n');
                await github.rest.issues.create({
                  ...context.repo,
                  title: `[依赖] ${names.length} 个依赖有更新`,
                  body: `## 可更新的依赖\n\n${list}`,
                  labels: ['dependencies']
                });
              }
            } catch(e) {}
        env:
          REPORT: ${{ steps.outdated.outputs.report }}
