# API Mock Visual Test - 测试场景配置模板
# 将此文件复制到目标项目根目录，按实际情况填写
#
# 使用方式：
#   1. 填写 project.name, project.baseUrl
#   2. 填写 scenarios 下的各测试场景
#   3. 运行: @test:run
#
# 字段说明见 SKILL.md 或 schema/test-scenarios.schema.json

version: "1.0"

project:
  name: ""                                 # 项目名称（必填）
  baseUrl: ""                              # 测试环境地址（必填）
  figma: ""                                # Figma 文件链接（可选）

targets:
  web:
    viewport:
      width: 375
      height: 812
    deviceScaleFactor: 2

scenarios:
  # ─── 场景模板 ───
